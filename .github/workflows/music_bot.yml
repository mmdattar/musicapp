name: Auto Fetch Royalty-Free Music

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python fetch_music.py
      - run: |
          git config --global user.name "CalmWave Bot"
          git config --global user.email "bot@github.com"
          git add songs.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update royalty-free tracks"
            git push
          fi
